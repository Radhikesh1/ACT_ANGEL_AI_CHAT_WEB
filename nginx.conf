server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket proxy for realtime events — MUST come before the / catch-all.
    # Without this block, /ws/realtime matches the SPA try_files rule and
    # nginx returns index.html (HTTP 200) instead of upgrading the connection
    # (HTTP 101), which causes "Unexpected response code: 200" in the browser.
    # proxy_read_timeout is extended so idle WebSocket connections are not
    # closed by nginx before the server-side 30-second ping fires.
    location /ws {
        proxy_pass https://actangels.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host actangels.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy /api calls to the backend
    location /api {
        proxy_pass https://actangels.com;
        proxy_set_header Host actangels.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # SPA routing — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
